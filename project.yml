name: CliSwiftUiTemplateApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  TemplateCore:
    path: Packages/TemplateCore

targets:
  CliSwiftUiTemplateApp:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
        type: syncedFolder
    dependencies:
      - package: TemplateCore
        product: TemplateCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CliSwiftUiTemplateApp
        DEVELOPMENT_TEAM: $(DEV_TEAM)
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "This is a template"
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "This is a template"
        INFOPLIST_KEY_NSCameraUsageDescription: "This is a template"
        SWIFT_VERSION: "6.0"
    entitlements:
      path: App/CliSwiftUiTemplate.entitlements
      properties:
        com.apple.developer.healthkit: false
        com.apple.developer.healthkit.access: []
